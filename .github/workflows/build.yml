name: Build OMNEX

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Ensure platform files
        run: flutter create . --project-name omnex --platforms=android
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - run: python3 tool/android_network.py
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: omnex-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Ensure platform files
        run: flutter create . --project-name omnex --platforms=windows
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: omnex-windows-build
          path: build/windows/x64/runner/Release/**
